# fly.toml — gerado por `fly launch`, ajustado à mão depois.
#
# Rode sempre a partir da RAIZ do repositório: o contexto de build precisa ser
# a raiz, porque o pnpm precisa do manifesto do workspace e do lockfile, que
# ficam acima deste diretório.
#
#   fly deploy --config apps/token-server/fly.toml --dockerfile apps/token-server/Dockerfile --remote-only
#
# Verificado em 19/08/2026: no ar em https://nigord-token.fly.dev.

app = 'nigord-token'
primary_region = 'gru'

[env]
  HOST = '0.0.0.0'
  PORT = '3000'
  # O Fly roteia por um proxy próprio, então sem isto todo o tráfego chega do
  # mesmo endereço e o limite de taxa vira um orçamento único do grupo.
  TRUST_PROXY = '1'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # Zero é deliberado: isto atende seis amigos algumas vezes por dia, e uma
  # máquina suspensa volta em bem menos de um segundo. Manter uma quente
  # gastaria a franquia à toa.
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/health'

[[vm]]
  # O padrão do `fly launch` é 1gb. Uma rota Fastify que assina JWTs não chega
  # perto disso, e memória é o que o Fly cobra — 512mb deixa folga de sobra
  # para o Node e para o tsx compilando na subida.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
