name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Lint, typecheck and tests are platform-independent — that is the point of
    # the boundary in design.md D2, and running them on Linux keeps CI fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
